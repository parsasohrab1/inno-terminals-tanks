name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------- backend
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check app

      - name: Train baseline leak model (open synthetic corpus)
        run: python -m app.ml.train

      - name: Assert FR-2.6 targets (recall >= 0.95, false-alarm < 5%)
        run: |
          python - <<'PY'
          from app.ml.model import LeakBaselineModel
          m = LeakBaselineModel.load()
          assert m and m.metrics, "model did not train"
          print("metrics:", m.metrics)
          assert m.metrics["recall"] >= 0.95, m.metrics
          assert m.metrics["false_alarm_rate"] < 0.05, m.metrics
          PY

      - name: Run tests
        run: python -m pytest -q

  # -------------------------------------------------- IP vault integrity gate
  ip-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No plaintext proprietary module may be committed
        run: |
          shopt -s nullglob
          leaked=(backend/app/secure/modules/*.py)
          for f in "${leaked[@]}"; do
            [ "$(basename "$f")" = "__init__.py" ] && continue
            echo "::error file=$f::plaintext proprietary module committed"
            exit 1
          done
          echo "OK — only encrypted *.py.enc blobs are present"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vault stays locked without a key, baseline still loads
        working-directory: backend
        run: |
          python -m pip install -q cryptography pydantic pydantic-settings sqlmodel
          python - <<'PY'
          from app import secure
          assert secure.available() is False, "INNO_IP_KEY must not be set in CI"
          for name in ("gnn_leak", "risk_aware_optimizer", "twin_leak_sim", "multimodal_acoustic"):
              assert secure.load(name) is None, f"{name} loaded without a key!"
          print("OK — locked vault degrades to open baseline")
          PY

      - name: Crypto primitives roundtrip
        working-directory: backend
        run: |
          python -m pip install -q pytest
          python -m pytest tests/test_vault.py -q

  # ---------------------------------------------------------------- frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type-check + production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ----------------------------------------------------------- docker images
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ip-vault]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: docker compose build
